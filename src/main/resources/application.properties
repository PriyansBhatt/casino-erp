spring.application.name=casino-erp

spring.datasource.url=jdbc:postgresql://localhost:5432/casino_erp_db
spring.datasource.username=postgres
spring.datasource.password=casino@123

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Adopt the existing non-empty database without recreating its schemas.
# Version 0 ensures V1 remains pending after the one-time baseline.
spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.schemas=public,customer
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Existing casino ERP schema
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

server.port=8080

# Required in every runtime profile. No embedded or development fallback.
casino.security.jwt.secret=${JWT_SIGNING_SECRET:}

# These MVC loggers interpolate parser/binding exception messages, including raw credentials.
# Keep other application/framework logging unchanged; controlled 400 responses are sanitized.
logging.level.org.springframework.web.method.HandlerMethod=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF
